name: changelog

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - cliff.toml
  pull_request:
    paths:
      - CHANGELOG.md
      - cliff.toml

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - run: git-cliff --output /tmp/CHANGELOG.md
      - run: diff -u CHANGELOG.md /tmp/CHANGELOG.md
