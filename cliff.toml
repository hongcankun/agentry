[changelog]
header = """
# Changelog

All notable Agentry changes are documented in this file.

This file is generated by `git-cliff`; update it as part of the release process instead of editing generated entries by hand.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% set groups = commits | group_by(attribute="group") %}\
{% for group in ["Breaking Changes", "Features", "Fixes", "Performance", "Security", "Refactoring", "Documentation", "Tests", "Continuous Integration", "Build", "Maintenance", "Style", "Reverts"] %}\
{% if groups[group] %}
### {{ group }}
{% for commit in groups[group] -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endif %}\
{% endfor %}

"""
trim = true
render_always = false

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^chore\\(release\\):", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^docs?", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^build", group = "Build" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^chore", group = "Maintenance" },
    { message = "^style", group = "Style" },
    { message = "^revert", group = "Reverts" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
