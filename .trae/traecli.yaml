# Project-level Trae config for the Agentry repo.
# Enables Agentry's own plugins only when working in this project (dogfooding).
# Plugins are sourced locally from the in-repo plugin directories, so they share
# the canonical source under plugins/ — do not copy components into .trae/.
plugins:
  - name: agentry-git
    type: local
    source: "${workspaceFolder}/plugins/agentry-git"
    enabled: true
  - name: agentry-code-quality
    type: local
    source: "${workspaceFolder}/plugins/agentry-code-quality"
    enabled: true
  - name: agentry-security
    type: local
    source: "${workspaceFolder}/plugins/agentry-security"
    enabled: true
  - name: agentry-authoring
    type: local
    source: "${workspaceFolder}/plugins/agentry-authoring"
    enabled: true
  - name: agentry-docs
    type: local
    source: "${workspaceFolder}/plugins/agentry-docs"
    enabled: true
